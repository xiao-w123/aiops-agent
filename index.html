<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能运维 Agent</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 { color: #333; }
        #input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }
        #message {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:disabled { background: #999; cursor: wait; }
        #clear-btn {
            background: #888;
            padding: 12px 16px;
        }
        .hint {
            color: #666;
            font-size: 14px;
            margin: 0 0 16px 0;
        }
        .hint a { color: #0066cc; text-decoration: none; }
        .hint a:hover { text-decoration: underline; }
        #output {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            min-height: 200px;
        }
        .turn { margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px dashed #e0e0e0; }
        .turn:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .q {
            font-weight: bold;
            color: #0066cc;
            margin-bottom: 8px;
            white-space: pre-wrap;
        }
        .a {
            white-space: pre-wrap;
            line-height: 1.8;
            color: #222;
        }
        .meta {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }
        .pending { color: #999; font-style: italic; }
        .error { color: #c00; }
    </style>
</head>
<body>
    <h1>🔍 智能运维 Agent</h1>
    <p class="hint">输入一个运维问题，Agent 会自动查监控、查日志、查发布记录、翻历史故障报告。</p>

    <div id="input-area">
        <input id="message" type="text"
               placeholder="例如：历史上有没有类似的连接池故障？"
               value="order-service 昨晚的 CPU 使用率是多少？">
        <button id="send" onclick="sendMessage()">排查</button>
        <button id="clear-btn" onclick="clearHistory()">清空</button>
    </div>

    <p class="hint">
        试试这些（越靠前越快）：
        <a href="#" onclick="fill('order-service 昨晚的 CPU 使用率是多少？');return false;">CPU 使用率</a> ·
        <a href="#" onclick="fill('order-service 昨晚发过版吗？');return false;">发布记录</a> ·
        <a href="#" onclick="fill('历史上有没有类似的连接池故障？当时是怎么解决的？');return false;">历史故障</a> ·
        <a href="#" onclick="fill('gateway-service 现在运行正常吗？');return false;">健康检查</a> ·
        <a href="#" onclick="fill('order-service 昨晚为什么响应变慢？');return false;">根因分析（较慢）</a>
        <br>
        <strong>支持多轮追问</strong>：先问上面任意一个，再追问「继续，帮我定位根因」即可。
    </p>

    <div id="output"></div>

    <script>
        // 对话历史：每项为 {role, content}。多轮追问依赖它。
        let history = [];
        // 工具名 → 中文短名，用于在界面上展示 Agent 实际调了什么
        const TOOL_LABELS = {
            "query_prometheus_tool": "查监控",
            "search_logs_tool": "查日志",
            "get_deployment_record_tool": "查发布记录",
            "search_fault_reports": "检索历史故障",
        };

        const output = document.getElementById("output");
        const input = document.getElementById("message");
        const button = document.getElementById("send");

        function fill(text) {
            input.value = text;
            input.focus();
        }

        function clearHistory() {
            history = [];
            output.innerHTML = '<div class="pending">已清空对话，可以开始新的排查。</div>';
            input.focus();
        }

        function esc(s) {
            const d = document.createElement("div");
            d.textContent = s;
            return d.innerHTML;
        }

        function renderTurn(question, answerHtml, metaHtml) {
            const div = document.createElement("div");
            div.className = "turn";
            // 注意：meta 容器必须**无条件创建**。
            // 若写成 (metaHtml ? ... : "")，则 metaHtml 为 "" 时该元素不存在，
            // 后续 querySelector(".meta") 返回 null，赋值 textContent 会抛
            // TypeError 并被 catch 捕获，表现为"出错了：Cannot set properties of null"。
            div.innerHTML =
                `<div class="q">🙋 ${esc(question)}</div>` +
                `<div class="a">${answerHtml}</div>` +
                `<div class="meta">${metaHtml || ""}</div>`;
            output.appendChild(div);
            div.scrollIntoView({ behavior: "smooth", block: "nearest" });
            return div;
        }

        // 防止重复提交：请求进行中时忽略再次点击 / 回车
        let busy = false;

        async function sendMessage() {
            if (busy) return;
            const message = input.value.trim();
            if (!message) return;

            // 把本轮问题作为占位先渲染出来
            const pendingTurn = renderTurn(
                message, '<span class="pending">Agent 正在排查中，请稍候…</span>', "");
            const answerEl = pendingTurn.querySelector(".a");
            const metaEl = pendingTurn.querySelector(".meta");

            // 兜底：即便 DOM 结构意外变化，也只降级显示，不抛异常
            const setAnswer = (fn) => { if (answerEl) fn(answerEl); };
            const setMeta = (text) => { if (metaEl) metaEl.textContent = text; };

            busy = true;
            button.disabled = true;
            const t0 = Date.now();

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message, messages: history })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                const secs = ((Date.now() - t0) / 1000).toFixed(1);
                setAnswer(el => { el.textContent = data.reply; });

                // 把本轮追加进历史，供后续追问使用
                history.push({ role: "user", content: message });
                history.push({ role: "assistant", content: data.reply });

                const tools = (data.tools || []).map(t => TOOL_LABELS[t] || t);
                const uniq = [...new Set(tools)];
                setMeta(
                    `耗时 ${secs}s · 调用 ${data.tool_count || 0} 次工具` +
                    (uniq.length ? `（${uniq.join(" → ")}）` : "") +
                    ` · 已积累 ${history.length / 2} 轮对话`
                );

                input.value = "";
            } catch (e) {
                setAnswer(el => {
                    el.innerHTML = `<span class="error">出错了：${esc(e.message)}</span>`;
                });
                setMeta("");
            } finally {
                busy = false;
                button.disabled = false;
                input.focus();
            }
        }

        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        clearHistory();
    </script>
</body>
</html>
